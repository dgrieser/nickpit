    name: Review
  - pipeline:
      - type: merge
        config:
          scope: cluster
          time_budget:
            weight: 30
          context:
            styleguides: true
            diff: true
            commits: true
            comments: true
            toolchain: true
            project_context: true
      - type: finalize
        config:
          model: "@small"
          scope: cluster
          time_budget:
            weight: 40
      - type: verdict
        config:
          model: "@small"
          scope: all
          time_budget:
            weight: 20
      - type: summarize
        config:
          model: "@small"
          scope: cluster
          time_budget:
            weight: 10
    name: Finalize
    config:
      time_budget:
        max_seconds: 1200
