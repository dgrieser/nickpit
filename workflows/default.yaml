version: 1
name: Standard review       # optional; shown above the live progress dashboard
# profile: default          # optional; same as --profile

steps:
  - type: collect-context
    name: Context
    config:
      time_budget:
        max_seconds: 300
  # Each review lane caps at 2100s and its steps split that cap by weight.
  # verify 30 + dedupe 15 leaves the review step the implicit remainder, 55% = 19m15s.
  # Do not write that 55 out as an explicit `weight` on the review step: a weight
  # there also switches on the per-phase split inside the step (main, mine_reasoning,
  # compile_findings, nudge) and the same number is reused as the main phase's share
  # of the step budget, so `weight: 55` would cut the main review pass to 55% of 19m15s
  # instead of leaving the whole 19m15s for the phases to share.
  - parallel:
      - lane:
          - type: review:codequality
            config:
              mine_reasoning:
                model: "@small"
              compile_findings:
                model: "@small"
          - type: verify:codequality
            config:
              scope: finding
              time_budget:
                weight: 30
              categorize:
                model: "@small"
                # The classifier's share of the verify step; the verifier takes
                # the rest. Bounded because a classifier stalling on the endpoint
                # used to consume the whole step and ship unverified findings.
                time_budget:
                  weight: 15
          - type: dedupe:codequality
            config:
              scope: reviewer
              time_budget:
                weight: 15
              context:
                styleguides: true
                diff: true
                commits: true
                comments: true
                toolchain: true
                project_context: true
        name: Code quality
        config:
          time_budget:
            max_seconds: 2100
      - lane:
          - type: review:security
            config:
              mine_reasoning:
                model: "@small"
              compile_findings:
                model: "@small"
          - type: verify:security
            config:
              scope: finding
              time_budget:
                weight: 30
              categorize:
                model: "@small"
                # The classifier's share of the verify step; the verifier takes
                # the rest. Bounded because a classifier stalling on the endpoint
                # used to consume the whole step and ship unverified findings.
                time_budget:
                  weight: 15
          - type: dedupe:security
            config:
              scope: reviewer
              time_budget:
                weight: 15
              context:
                styleguides: true
                diff: true
                commits: true
                comments: true
                toolchain: true
                project_context: true
        name: Security
        config:
          time_budget:
            max_seconds: 2100
      - lane:
          - type: review:architecture
            config:
              mine_reasoning:
                model: "@small"
              compile_findings:
                model: "@small"
          - type: verify:architecture
            config:
              scope: finding
              time_budget:
                weight: 30
              categorize:
                model: "@small"
                # The classifier's share of the verify step; the verifier takes
                # the rest. Bounded because a classifier stalling on the endpoint
                # used to consume the whole step and ship unverified findings.
                time_budget:
                  weight: 15
          - type: dedupe:architecture
            config:
              scope: reviewer
              time_budget:
                weight: 15
              context:
                styleguides: true
                diff: true
                commits: true
                comments: true
                toolchain: true
                project_context: true
        name: Architecture
        config:
          time_budget:
            max_seconds: 2100
      - lane:
          - type: review:performance
            config:
              mine_reasoning:
                model: "@small"
              compile_findings:
                model: "@small"
          - type: verify:performance
