version: 1
name: Standard review       # optional; shown above the live progress dashboard
# profile: default          # optional; same as --profile

steps:
  - type: collect-context
    name: Context
    config:
      time_budget:
        max_seconds: 360
  # Each review lane caps at 2400s and its steps split that cap by weight.
  # verify 30 + dedupe 15 leaves the review step the implicit remainder, 55% = 22m.
  # Do not write that 55 out as an explicit `weight` on the review step: a weight
  # there also switches on the per-phase split inside the step (main, mine_reasoning,
  # compile_findings, nudge) and the same number is reused as the main phase's share
  # of the step budget, so `weight: 55` would cut the main review pass to 55% of 22m
  # instead of leaving the whole 22m for the phases to share.
  - parallel:
      - lane:
          - type: review:codequality
            config:
              mine_reasoning:
                model: "@small"
              compile_findings:
                model: "@small"
          - type: verify:codequality
            config:
              scope: finding
              time_budget:
                weight: 30
              categorize:
                model: "@small"
                # The classifier's share of the verify step; the verifier takes
                # the rest. Bounded because a classifier stalling on the endpoint
                # used to consume the whole step and ship unverified findings.
                time_budget:
                  weight: 5
                  max_seconds: 30
          - type: dedupe:codequality
            config:
              scope: reviewer
              time_budget:
                weight: 15
              context:
                styleguides: true
                diff: true
                commits: true
                comments: true
                toolchain: true
                project_context: true
        name: Code quality
        config:
          time_budget:
            max_seconds: 2400
      - lane:
          - type: review:security
            config:
              mine_reasoning:
                model: "@small"
              compile_findings:
                model: "@small"
          - type: verify:security
            config:
              scope: finding
              time_budget:
                weight: 30
              categorize:
                model: "@small"
                # The classifier's share of the verify step; the verifier takes
                # the rest. Bounded because a classifier stalling on the endpoint
                # used to consume the whole step and ship unverified findings.
                time_budget:
                  weight: 5
                  max_seconds: 30
          - type: dedupe:security
            config:
              scope: reviewer
              time_budget:
                weight: 15
              context:
                styleguides: true
                diff: true
                commits: true
                comments: true
                toolchain: true
                project_context: true
        name: Security
        config:
          time_budget:
            max_seconds: 2400
      - lane:
          - type: review:architecture
            config:
              mine_reasoning:
                model: "@small"
              compile_findings:
                model: "@small"
          - type: verify:architecture
            config:
              scope: finding
              time_budget:
                weight: 30
              categorize:
                model: "@small"
                # The classifier's share of the verify step; the verifier takes
                # the rest. Bounded because a classifier stalling on the endpoint
                # used to consume the whole step and ship unverified findings.
                time_budget:
                  weight: 5
                  max_seconds: 30
          - type: dedupe:architecture
            config:
              scope: reviewer
              time_budget:
                weight: 15
              context:
                styleguides: true
                diff: true
                commits: true
                comments: true
                toolchain: true
                project_context: true
        name: Architecture
        config:
          time_budget:
            max_seconds: 2400
      - lane:
          - type: review:performance
            config:
              mine_reasoning:
                model: "@small"
              compile_findings:
                model: "@small"
          - type: verify:performance
            config:
              scope: finding
              time_budget:
                weight: 30
              categorize:
                model: "@small"
                # The classifier's share of the verify step; the verifier takes
                # the rest. Bounded because a classifier stalling on the endpoint
                # used to consume the whole step and ship unverified findings.
                time_budget:
                  weight: 5
                  max_seconds: 30
          - type: dedupe:performance
            config:
              scope: reviewer
              time_budget:
                weight: 15
              context:
                styleguides: true
                diff: true
                commits: true
                comments: true
                toolchain: true
                project_context: true
        name: Performance
        config:
          time_budget:
            max_seconds: 2400
      - lane:
          - type: review:testing
            config:
              mine_reasoning:
                model: "@small"
              compile_findings:
                model: "@small"
          - type: verify:testing
            config:
              scope: finding
              time_budget:
                weight: 30
              categorize:
                model: "@small"
                # The classifier's share of the verify step; the verifier takes
                # the rest. Bounded because a classifier stalling on the endpoint
                # used to consume the whole step and ship unverified findings.
                time_budget:
                  weight: 5
                  max_seconds: 30
          - type: dedupe:testing
            config:
              scope: reviewer
              time_budget:
                weight: 15
              context:
                styleguides: true
                diff: true
                commits: true
                comments: true
                toolchain: true
                project_context: true
        name: Testing
        config:
          time_budget:
            max_seconds: 2400
      - lane:
          - type: review:bestpractices
            config:
              mine_reasoning:
                model: "@small"
              compile_findings:
                model: "@small"
          - type: verify:bestpractices
            config:
              scope: finding
              time_budget:
                weight: 30
              categorize:
                model: "@small"
                # The classifier's share of the verify step; the verifier takes
                # the rest. Bounded because a classifier stalling on the endpoint
                # used to consume the whole step and ship unverified findings.
                time_budget:
                  weight: 5
                  max_seconds: 30
          - type: dedupe:bestpractices
            config:
              scope: reviewer
              time_budget:
                weight: 15
              context:
                styleguides: true
                diff: true
                commits: true
                comments: true
                toolchain: true
                project_context: true
        name: Best practices
        config:
          time_budget:
            max_seconds: 2400
      # On a re-review, the open findings of the review already published on
      # the merge request are imported, verified again against the current
      # code (the verifier is told they may be outdated), and merged with the
      # new findings. Empty unless publishing to a source that can read the
      # published review (GitLab) and a review is already there.
      - lane:
          - type: import-findings
            config:
              group: published
              source: published-review
          - type: verify:published
            config:
              scope: finding
              categorize:
                model: "@small"
                time_budget:
                  weight: 5
                  max_seconds: 30
        name: Published findings
        config:
          time_budget:
            max_seconds: 2400
    name: Review
  - pipeline:
      - type: merge
        config:
          scope: cluster
          time_budget:
            weight: 50
          context:
            styleguides: true
            diff: true
            commits: true
            comments: true
            toolchain: true
            project_context: true
      - type: finalize
        config:
          model: "@small"
          scope: cluster
          time_budget:
            weight: 30
      # Folds the run into the imported published review before the verdict:
      # imported findings keep their threads, refuted or merged-away ones are
      # resolved, and ones that were not re-verified stay open as records the
      # verdict sees as read-only context. No model calls.
      - type: reconcile
        config:
          scope: all
          group: published
      - type: verdict
        config:
          model: "@small"
          scope: all
          time_budget:
            weight: 10
      - type: summarize
        config:
          model: "@small"
          scope: cluster
          time_budget:
            weight: 10
    name: Finalize
    config:
      time_budget:
        max_seconds: 900
