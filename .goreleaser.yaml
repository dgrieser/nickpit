version: 2

builds:
  - main: ./cmd/nickpit
    binary: nickpit
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/mittwald/cli-kit/buildinfo.Version={{.Version}}
      # Go would embed the revision itself here (-trimpath does not suppress
      # that), but only as whatever the release runner's checkout looks like:
      # a shallow or detached CI clone can end up flagged vcs.modified, which
      # would print a bogus "-dirty" suffix. goreleaser knows the exact commit
      # it is releasing, so stamp it explicitly and never consult the fallback.
      # Only untagged builds render it — a tagged build prints the tag alone,
      # since the tag already pins its commit.
      - -X github.com/mittwald/cli-kit/buildinfo.Commit={{.FullCommit}}
      - -X github.com/mittwald/cli-kit/buildinfo.Date={{.CommitDate}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - "7"
    ignore:
      - goos: darwin
        goarch: amd64
      - goos: darwin
        goarch: arm
      - goos: windows
        goarch: arm64
      - goos: windows
        goarch: arm

archives:
  - formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}"

checksum:
  name_template: "checksums.txt"

changelog:
  # GitHub's own release-note generator: one line per merged pull request
  # (title, author, link) instead of the raw commit list. Categories and
  # exclusions come from .github/release.yml.
  use: github-native
