# Default values for nickpit-serve.

# -- Number of daemon replicas. MUST stay 1: the daemon holds an in-memory
# review queue and a per-(project,iid,sha) "already reviewed" LRU. Two replicas
# behind one Service would each receive a share of webhooks and could review the
# same MR twice (comment publishing is idempotent via fingerprints, so it is not
# catastrophic, but it wastes LLM calls).
replicaCount: 1

image:
  repository: ghcr.io/dgrieser/nickpit
  # REQUIRED, no default — pass at install time (--set image.tag=v0.0.x or a
  # values file) so the running version has a single, deliberate source.
  # The image is published by the repo's Docker workflow on `v*` tags.
  tag: ""
  pullPolicy: IfNotPresent

# Image pull secrets, e.g. for a private ghcr.io package.
# - name: ghcr-pull-secret
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  # The daemon never calls the Kubernetes API; no token needs mounting.
  automount: false
  annotations: {}

# Extra pod annotations (merged with the config checksum annotation that forces
# a rollout when the ConfigMap changes).
podAnnotations: {}
podLabels: {}

# Pod-level security context. The image runs as the distroless "nonroot" user.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  # Avoid recursively reapplying fsGroup to the private 0700 journal child on
  # every PVC remount. The PVC root already matches after its first mount.
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

# Container-level security context. The image ships git + config via env, so the
# root filesystem can be read-only; writable paths are emptyDir mounts.
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8080

ingress:
  # GitLab must be able to POST webhooks to the daemon, so external reachability
  # is usually required. Set `host` before installing.
  enabled: true
  # Ingress class serving the webhook host. REQUIRED (no default) while
  # ingress is enabled — pass it at install time:
  #   --set ingress.className=nginx-internal
  className: ""
  annotations: {}
  # Public hostname GitLab sends webhooks to. REQUIRED (no default) while
  # ingress is enabled — pass it at install time:
  #   --set ingress.host=nickpit.example.com
  host: ""
  # Only the webhook path needs to be public; /healthz stays cluster-internal.
  path: /webhooks/gitlab
  pathType: Prefix
  # With secretName empty the ingress controller serves its default
  # certificate — enough when that is a wildcard covering the host
  # For a cert-manager per-host cert instead, set secretName and add
  # annotation kubernetes.io/tls-acme: "true".
  tls:
    enabled: true
    secretName: ""

# Container resources. Reviews clone the repo (git) and stream from the LLM;
# concurrency is bounded by serve.reviewConcurrency.
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi

# Ephemeral scratch volumes (root fs is read-only). work holds git clones +
# per-review logs; tmp and home cover git's incidental writes (including the
# session cache — see maxSessions).
volumes:
  work:
    sizeLimit: 5Gi
  tmp:
    sizeLimit: 1Gi
  home:
    sizeLimit: 256Mi

# Persistent storage for the review-job state journal (serve.stateDir): the
# daemon journals accepted-but-unfinished reviews in a private `journal` child
# below this PVC mount and resumes them at the
# next start. With enabled: false the journal lands on the `work` emptyDir —
# it then survives container restarts (crash, OOM, liveness kill) but NOT pod
# replacement: every image upgrade or reschedule loses queued reviews and their
# command comments keep no answer. Enable a small PVC to keep them across
# upgrades. (Set serve.stateDir: "" to disable journaling entirely.)
persistence:
  enabled: false
  size: 1Gi
  # Empty uses the cluster's default StorageClass.
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  annotations: {}

# Cap on auto-saved chat sessions, passed to every review child as
# --max-sessions. Sessions land in $HOME/.cache/nickpit/sessions on the `home`
# volume and each one holds a full review context, so the CLI default (0 =
# unlimited) would grow one file per reviewed MR until the emptyDir sizeLimit
# trips and Kubernetes evicts the pod. Raise this together with
# volumes.home.sizeLimit; 0 restores unlimited (only sane with durable storage).
maxSessions: 50

# MUST exceed serve.shutdownGrace (600s for "10m") so Kubernetes lets in-flight
# reviews finish before SIGKILL. 660 = 10m grace + 60s buffer; the buffer also
# covers the terminated reviews flipping their reaction to failEmoji (15s each,
# in parallel).
terminationGracePeriodSeconds: 660

# Extra daemon flags. --verbose and --output json toggle the daemon's own slog output.
verbose: false
jsonLog: false
extraArgs: []

# Guards the init window: the daemon resolves each group token's bot-user ID via
# GitLab lookups before /healthz serves. Liveness/readiness are suppressed until
# this passes, so a slow GitLab can't trigger a crash loop. ~60s window.
startupProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 3
  failureThreshold: 20
  timeoutSeconds: 3

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 20
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 3
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

nodeSelector: {}
tolerations: []
affinity: {}

# ---------------------------------------------------------------------------
# Secrets. Do NOT commit real values here. The Secret serves two purposes:
#   - env vars: every key that is a valid env var name is injected via envFrom
#     and pulled into the two config files via ${VAR} expansion (both files are
#     env-expanded before YAML parsing) — e.g. MITTWALD_LLM_API_KEY.
#   - group inventory: the key named by serve.groupsSecretKey (default
#     groups.yaml) holds the full GitLab group list, tokens included, so adding
#     a group only touches the Secret — never this file. It is mounted as a
#     file, not injected as env (a dotted key is skipped by envFrom anyway).
#
# Provide values one of two ways:
#   1. existingSecret: reference a Secret you created out-of-band (recommended
#      for prod; e.g. from Vault / External Secrets).
#   2. secrets: let the chart create the Secret from the map below. Populate at
#      install time via `--set-file` / `--set`, never in a committed values
#      file, e.g.:  --set-file secrets.groups\.yaml=my-groups.yaml
# ---------------------------------------------------------------------------
existingSecret: ""
secrets:
  MITTWALD_LLM_API_KEY: ""
  # Only needed when the profile's small model runs on a second LLM endpoint
  # (config.nickpitYaml below): that endpoint requires its own key.
  # NICKPIT_SMALL_API_KEY: ""
  # Group inventory (see serve.groupsSecretKey). Shape per entry: path = group
  # full path (longest-prefix matched at '/' boundaries), token = group access
  # token, and exactly one of signing_token (whsec_... from GitLab's "Generate
  # signing token", shown once at webhook creation; HMAC-SHA256, recommended)
  # or webhook_secret (legacy plaintext X-Gitlab-Token).
  # groups.yaml: |
  #   groups:
  #     - path: "mygroup"
  #       token: "glpat-..."
  #       signing_token: "whsec_..."
  # Optional; only if reviewing GitHub repos too.
  # NICKPIT_GITHUB_TOKEN: ""

# ---------------------------------------------------------------------------
# serve.yaml — daemon config (groups, trigger policy). Rendered to a ConfigMap.
# token / signing_token / webhook_secret values are pulled from env (the Secret
# above) via the *Env fields, so no secret text lands in the ConfigMap.
# ---------------------------------------------------------------------------
serve:
  listen: ":8080"
  logDir: "/work/logs"
  # Journal for accepted-but-unfinished review jobs, resumed after a restart.
  # Lives directly on the `work` emptyDir unless persistence.enabled mounts a
  # PVC here and uses its private `journal` child (see persistence above). Must
  # be absolute when persistence is enabled and cannot equal a fixed mount path
  # (/etc/nickpit, /work, /tmp, /home/nonroot) or filesystem root (/).
  # "" disables journaling.
  stateDir: "/work/state"
  reviewConcurrency: 2
  shutdownGrace: "10m"
  # GitLab instance the webhooks come from and reviews are posted to. REQUIRED
  # (no default) — pass it at install time:
  #   --set serve.gitlabBaseURL=https://gitlab.example.com
  gitlabBaseURL: ""
  topic: "nickpit"
  triggerEmoji: "nickpit"
  # "eyes" awarded at review start; "" disables. Must differ from triggerEmoji.
  startEmoji: "eyes"
  commandKeyword: "nickpit"
  # Reaction awarded on a /nickpit review command note. "eyes" = on it; "" disables.
  ackEmoji: "eyes"
  # Reaction awarded on a /nickpit abort command note. "stop_button"; "" disables.
  abortEmoji: "stop_button"
  # Reactions that REPLACE startEmoji/ackEmoji when the review ends: doneEmoji
  # when it landed, failEmoji when it did not. "" only revokes the in-progress
  # reaction. Both must differ from triggerEmoji, from each other, and from the
  # reactions they replace.
  # Built-in values are omitted from rendered server.yaml so legacy reaction
  # settings that collide with a new default remain upgradeable.
  doneEmoji: "white_check_mark"
  failEmoji: "x"
  # Where the GitLab group inventory comes from. Default: the Secret key named
  # here is mounted at /etc/nickpit/groups.yaml and referenced from server.yaml
  # via groups_file, so groups (paths + tokens) live entirely in the Secret and
  # adding one never touches chart values. Set to "" to disable and list groups
  # inline below instead. At least one of the two sources must be configured.
  groupsSecretKey: "groups.yaml"
  # Optional inline groups, rendered into the ConfigMap with ${ENV} token
  # references (merged with the groups file when both are set). path = group
  # full path (longest-prefix matched at '/' boundaries). tokenEnv names the
  # env var (Secret key) holding the group access token. For webhook
  # verification set exactly one of:
  #   signingTokenEnv  - GitLab signing token (whsec_..., HMAC-SHA256, recommended)
  #   webhookSecretEnv - legacy plaintext secret token (X-Gitlab-Token)
  # groups:
  #   - path: "mygroup"
  #     tokenEnv: "NICKPIT_GROUP_MYGROUP_TOKEN"
  #     signingTokenEnv: "NICKPIT_GROUP_MYGROUP_SIGNING_TOKEN"
  groups: []
  review:
    # Extra args appended to every `nickpit gitlab mr --publish` child. This is
    # where the LLM profile is selected; pass it at install time, e.g.:
    #   --set serve.review.extraArgs='{--profile,mittwald}'
    # Empty = children use the binary's default profile (openrouter; needs
    # OPENROUTER_API_KEY in the Secret).
    extraArgs: []
  # Discussion-agent replies in bot-authored NickPit review threads.
  chat:
    enabled: true
    # false preserves current automatic replies. true requires `/nickpit
    # respond` on its own line in the question, or a triggerEmoji reaction on
    # that question comment.
    optIn: false
    # Reaction on a NickPit review root mutes that thread; reaction on the MR
    # mutes every NickPit thread. Removing the last matching human reaction
    # re-enables it. "" disables reaction-based muting. The built-in value is
    # omitted from rendered server.yaml so legacy reaction settings that
    # collide with the new default remain upgradeable.
    muteEmoji: "mute"
    # Full-line, case-insensitive response suppressors. Surrounding whitespace
    # is trimmed and internal whitespace collapsed. Empty by default.
    skipPhrases: []
    maxConcurrent: 4
    # null inherits review.extraArgs. A list, including [], replaces them.
    extraArgs: null
  # Optional: stream each review's output live to Grafana Loki (in addition to
  # the on-disk log_dir file), so logs survive pod restarts and are queryable
  # in Grafana. Enabled only when `url` is set. The daemon needs egress to the
  # Loki push endpoint (add a NetworkPolicy if the namespace is default-deny).
  # tenant_id and basic auth are pulled from env (Secret keys) via the *Env
  # fields, so no secret text lands in the ConfigMap.
  loki:
    url: ""                 # e.g. http://loki-gateway.monitoring:80 (push path appended)
    tenantIdEnv: ""         # Secret key holding the X-Scope-OrgID tenant; optional
    basicAuthUserEnv: ""    # Secret key holding the basic-auth username; optional
    basicAuthPassEnv: ""    # Secret key holding the basic-auth password; set with the user
    labels: {}              # extra static labels, e.g. {env: prod} (not app/project/iid/trigger)
    batchWait: "1s"
    batchMaxLines: 1000
    timeout: "10s"
    bufferLines: 4096
    gzip: false

# ---------------------------------------------------------------------------
# Optional .nickpit.yaml override for the review children. Empty (default):
# no file is rendered or mounted and children run on the binary's built-in
# profiles — serve.review.extraArgs selects one (e.g. --profile mittwald),
# the API key arrives via the Secret env, and the group token/base URL are
# injected per review. Set a full YAML document only for changes the
# built-ins cannot express (custom endpoint, new profile); ${VAR} refs are
# env-expanded, so secrets stay out of the ConfigMap:
#   nickpitYaml: |
#     active_profile: custom
#     profiles:
#       custom:
#         base_url: https://other-endpoint.example/v1
#         api_key: ${MY_LLM_API_KEY}
#         model: some-model
#         # Optional: run the "@small" steps on a second endpoint. A base_url
#         # differing from the one above requires its own api_key.
#         small:
#           base_url: https://llm.aihosting.mittwald.de/v1
#           api_key: ${MITTWALD_LLM_API_KEY}
#           model: some-small-model
# ---------------------------------------------------------------------------
# Seed the note commands (/nickpit review|abort|status|help) as GitLab comment
# templates in every group configured under `serve` — GitLab has no way to
# register a real quick action, so a template picked from the comment box's
# toolbar is the closest supported path to discoverability.
#
# Runs as a post-install/post-upgrade Helm hook Job with the same config and
# group tokens as the daemon. A failing hook marks the Helm release failed, and
# creating group-level templates needs a group token allowed to manage them
# (GitLab Premium or Ultimate) — verify with dryRun first, hence the safe
# default of off.
commentTemplates:
  enabled: false
  # Log the plan without writing anything (still fails on missing permissions,
  # because listing a group's templates is itself denied then).
  dryRun: false
  # Delete templates carrying the "<serve.commandKeyword>: " prefix that this
  # version no longer defines. Hand-written templates are never touched.
  prune: false
  # One attempt: a permission or configuration error will not fix itself on a
  # retry, and a transient GitLab outage is recovered by the next deploy.
  backoffLimit: 0
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

config:
  nickpitYaml: ""
