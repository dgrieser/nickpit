version: "2"

# Standard linter set: errcheck, govet, ineffassign, staticcheck, unused.
linters:
  default: standard
  enable:
    # gopls modernize analyzers (range-over-int, slices/maps helpers, min/max,
    # etc.) — not part of the standard set, so enable them explicitly. Keeping
    # them here rather than in a separate tool means `golangci-lint run` alone
    # reproduces exactly what CI checks.
    - modernize

issues:
  # Defaults cap a single check at 3 reports, which turns one bad pattern into
  # several rounds of CI failures instead of one complete list.
  max-same-issues: 0
  max-issues-per-linter: 0

formatters:
  enable:
    - gofmt
