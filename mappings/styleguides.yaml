# Styleguide mappings are embedded into the binary and decide which files from
# prompts/styleguides/ are sent to review, verify, finalize, verdict, and
# summarize agents.
#
# style_guides:
#   Maps a styleguide language key to a Markdown file under prompts/. An entry
#   is either a scalar file path (used for every version) or a mapping with a
#   `default` plus version-specific `versions` overrides keyed by a version or
#   semver range (e.g. "1.19", ">=1.22"). When a detected toolchain version
#   (from go.mod, Dockerfile, CI, ...) matches a version key, that guide is used
#   instead of the default. Conflicting detections are resolved by
#   version_source_priority; within one source tier the lowest version wins.
#   Add a new key here when adding a new styleguide file.
#
# version_source_priority:
#   Ordered source patterns per language, most authoritative first. Patterns
#   are matched case-insensitively against the Source of each detected
#   toolchain version and may use path.Match globs (".github/workflows/*")
#   with "/" as separator. A pattern without a slash matches the source's
#   base name, so nested manifests (services/api/go.mod) rank like root ones.
#   Only versions from the highest-priority tier that produced a usable
#   version take part in styleguide version selection, so a stale Dockerfile
#   cannot drag the guide below what go.mod declares. Sources not listed rank
#   together after every listed tier; languages without an entry keep the
#   plain lowest-version-wins behavior.
#
# style_guide_order:
#   Stable output order for selected guides. Every entry must exist in
#   style_guides. Add new guides here if prompt order should be deterministic.
#
# extension_overrides:
#   Overrides language detection only for styleguide selection. This is useful
#   when the general file language is broader than the guide split, for example
#   mapping .ts/.tsx to the TypeScript guide while general file detection groups
#   those extensions as nodejs.
#
# detectors:
#   Adds extra styleguides based on paths or content signals, including embedded
#   languages such as SQL in Go code or Kubernetes YAML in Helm templates.
#   `probe_paths` decides which changed or supplemental files are worth reading
#   for content-based detection. `match_any` adds the guide if any listed
#   matcher hits. `match_all` adds the guide only if every non-empty matcher
#   group hits at least once.
#
# Supported matcher keys:
#   extensions, basenames, basename_suffixes, path_segments, path_prefixes,
#   path_contains, content_contains, content_regex
#
# Path matching is lowercased and slash-normalized. content_contains is
# case-sensitive. content_regex uses Go regular expressions; prefer simple,
# bounded expressions because detectors run over changed-file content.
style_guides:
  go:
    default: styleguides/go.md
    versions:
      "1.19": styleguides/go-1.19.md
      "1.20": styleguides/go-1.20.md
      "1.21": styleguides/go-1.21.md
      "1.22": styleguides/go-1.22.md
      "1.23": styleguides/go-1.23.md
      "1.24": styleguides/go-1.24.md
      "1.25": styleguides/go-1.25.md
      "1.26": styleguides/go-1.26.md
      "1.27": styleguides/go-1.27.md
  python:
    default: styleguides/python.md
    versions:
      "2.7": styleguides/python-2.7.md
      ">=3.0 <3.7": styleguides/python-3.6.md
      ">=3.7 <3.9": styleguides/python-3.8.md
      ">=3.9 <3.10": styleguides/python-3.9.md
      ">=3.10 <3.11": styleguides/python-3.10.md
      ">=3.11 <3.12": styleguides/python-3.11.md
      ">=3.12 <3.13": styleguides/python-3.12.md
      ">=3.13 <3.14": styleguides/python-3.13.md
      ">=3.14 <3.15": styleguides/python-3.14.md
      ">=3.15 <3.16": styleguides/python-3.15.md
  javascript:
    default: styleguides/javascript.md
    versions:
      # Keyed by Node.js major; odd (Current-only) lines use the previous
      # LTS guide so the reviewer never assumes a newer line's backports.
      "<18": styleguides/javascript-node-16.md
      ">=18 <20": styleguides/javascript-node-18.md
      ">=20 <22": styleguides/javascript-node-20.md
      ">=22 <24": styleguides/javascript-node-22.md
      ">=24 <26": styleguides/javascript-node-24.md
      ">=26 <27": styleguides/javascript-node-26.md
  typescript:
    default: styleguides/typescript.md
    versions:
      # Keyed by the typescript package version; 4.x shares the 4.9
      # guide, which tags every feature with the 4.x minor it needs.
      ">=4.0 <5.0": styleguides/typescript-4.9.md
      "5.0": styleguides/typescript-5.0.md
      "5.1": styleguides/typescript-5.1.md
      "5.2": styleguides/typescript-5.2.md
      "5.3": styleguides/typescript-5.3.md
      "5.4": styleguides/typescript-5.4.md
      "5.5": styleguides/typescript-5.5.md
      "5.6": styleguides/typescript-5.6.md
      "5.7": styleguides/typescript-5.7.md
      "5.8": styleguides/typescript-5.8.md
      "5.9": styleguides/typescript-5.9.md
      "6.0": styleguides/typescript-6.0.md
      "7.0": styleguides/typescript-7.0.md
  html: styleguides/html-css.md
  css: styleguides/html-css.md
  scss: styleguides/html-css.md
  csharp:
    default: styleguides/csharp.md
    versions:
      # Keyed by C# language version (LangVersion, or the target
      # framework's default: net8.0 -> 12.0). C# 8 and older share the
      # C# 9 guide, which marks every C# 9 feature and its down-level
      # requirements.
      "<10": styleguides/csharp-9.md
      "10": styleguides/csharp-10.md
      "11": styleguides/csharp-11.md
      "12": styleguides/csharp-12.md
      "13": styleguides/csharp-13.md
      "14": styleguides/csharp-14.md
      "15": styleguides/csharp-15.md
  rust:
    default: styleguides/rust.md
    versions:
      # Keyed by the crate's edition (Cargo.toml `edition`, inherited from
      # [workspace.package], Cargo's 2015 default when unset), not by the
      # compiler: the edition guides label every feature with the rustc
      # release that stabilised it. 2015 crates share the 2018 guide, which
      # covers the 2015 differences.
      "2015": styleguides/rust-2018.md
      "2018": styleguides/rust-2018.md
      "2021": styleguides/rust-2021.md
      "2024": styleguides/rust-2024.md
  sql: styleguides/sql.md
  postgresql:
    default: styleguides/postgresql.md
    versions:
      # Keyed by the PostgreSQL server major pinned by container images in
      # Compose files, CI and the Dockerfile. 13 and older share the 14
      # guide, which marks every 14 feature and its 13 boundary.
      "<15": styleguides/postgresql-14.md
      "15": styleguides/postgresql-15.md
      "16": styleguides/postgresql-16.md
      "17": styleguides/postgresql-17.md
      "18": styleguides/postgresql-18.md
      "19": styleguides/postgresql-19.md
  mysql:
    default: styleguides/mysql.md
    versions:
      # Keyed by the MySQL server version pinned by container images in
      # Compose files, CI and the Dockerfile. 8.1-8.3 and 9.0-9.6 were
      # Innovation releases between the LTS lines; they get the guide of the
      # LTS line below them. 5.7 and the 26.x Innovation releases keep the
      # generic guide.
      "8.0": styleguides/mysql-8.0.md
      ">=8.1 <9.7": styleguides/mysql-8.4.md
      "9.7": styleguides/mysql-9.7.md
  shell: styleguides/bash.md
  helm:
    default: styleguides/helm.md
    versions:
      # Keyed by the Helm CLI version (.tool-versions, azure/setup-helm,
      # alpine/helm images). Helm 2 has no guide of its own.
      "3": styleguides/helm-3.md
      "4": styleguides/helm-4.md
  kubernetes:
    default: styleguides/kubernetes.md
    versions:
      # Keyed by the Kubernetes minor the code targets: k8s.io/* v0.Y in
      # go.mod (v0.33.2 -> 1.33), ENVTEST_K8S_VERSION, kindest/node images
      # and kubectl in .tool-versions. Releases before 1.29 keep the
      # generic guide.
      "1.29": styleguides/kubernetes-1.29.md
      "1.30": styleguides/kubernetes-1.30.md
      "1.31": styleguides/kubernetes-1.31.md
      "1.32": styleguides/kubernetes-1.32.md
      "1.33": styleguides/kubernetes-1.33.md
      "1.34": styleguides/kubernetes-1.34.md
      "1.35": styleguides/kubernetes-1.35.md
      "1.36": styleguides/kubernetes-1.36.md
      "1.37": styleguides/kubernetes-1.37.md

version_source_priority:
  go:
    - go.mod
    - .tool-versions
    - .github/workflows/*
    - .gitlab-ci.yml
    - Dockerfile
  python:
    - pyproject.toml
    - Pipfile
    - setup.cfg
    - setup.py
    - .python-version
    - runtime.txt
    - .tool-versions
    - .github/workflows/*
    - .gitlab-ci.yml
    - Dockerfile
  javascript:
    - package.json
    - .nvmrc
    - .node-version
    - .tool-versions
    - .github/workflows/*
    - .gitlab-ci.yml
    - Dockerfile
  csharp:
    - "*.csproj"
    - Directory.Build.props
    - .tool-versions
    - .github/workflows/*
    - .gitlab-ci.yml
    - Dockerfile
  helm:
    - .tool-versions
    - .github/workflows/*
    - .gitlab-ci.yml
    - Dockerfile
  kubernetes:
    - go.mod
    - Makefile
    - .tool-versions
    - .github/workflows/*
    - .gitlab-ci.yml
  rust:
    - Cargo.toml
  postgresql:
    - compose.yaml
    - compose.yml
    - docker-compose.yaml
    - docker-compose.yml
    - .gitlab-ci.yml
    - .github/workflows/*
    - Dockerfile
  mysql:
    - compose.yaml
    - compose.yml
    - docker-compose.yaml
    - docker-compose.yml
    - .gitlab-ci.yml
    - .github/workflows/*
    - Dockerfile
  typescript:
    - package-lock.json
    - yarn.lock
    - pnpm-lock.yaml
    - package.json

style_guide_order:
  - go
  - python
  - javascript
  - typescript
  - html
  - css
  - scss
  - csharp
  - rust
  - sql
  - postgresql
  - mysql
  - shell
  - helm
  - kubernetes

extension_overrides:
  javascript:
    - .js
    - .mjs
    - .cjs
    - .jsx
  typescript:
    - .ts
    - .mts
    - .cts
    - .tsx

detectors:
  - language: sql
    probe_paths:
      extensions: [.go, .py, .js, .jsx, .ts, .tsx, .cs, .java, .kt, .rb, .php, .sql]
      path_segments: [migrations, migration, db, database, queries, schema]
    match_any:
      extensions: [.sql]
      content_regex:
        - '(?is)\bselect\b.+\bfrom\b'
        - '(?is)\binsert\s+into\b'
        - '(?is)\bupdate\b.+\bset\b'
        - '(?is)\bdelete\s+from\b'
        - '(?is)\bcreate\s+(?:table|index)\b'
        - '(?is)\balter\s+table\b'
        - '(?is)\bexplain(?:\s+analyze)?\b'
        - '(?is)\bwith\b.+\bselect\b'

  - language: rust
    probe_paths:
      basenames: [Cargo.toml, Cargo.lock, rust-toolchain, rust-toolchain.toml]
    match_any:
      basenames: [Cargo.toml, Cargo.lock, rust-toolchain, rust-toolchain.toml]

  - language: postgresql
    probe_paths:
      extensions: [.go, .py, .js, .jsx, .ts, .tsx, .cs, .java, .kt, .rb, .php, .sql]
      path_segments: [migrations, migration, db, database, queries, schema]
    match_any:
      content_contains:
        - github.com/jackc/pgx
        - github.com/lib/pq
        - 'postgres://'
        - 'postgresql://'
        - import psycopg
        - import asyncpg
        - from 'pg'
        - require('pg')
        - Npgsql
        - CREATE INDEX CONCURRENTLY
        - pg_catalog.
      content_regex:
        - '(?i)::(?:jsonb|timestamptz|regclass|text\[\])\b'
        - '(?i)\bGENERATED\s+(?:ALWAYS|BY\s+DEFAULT)\s+AS\s+IDENTITY\b'

  - language: mysql
    probe_paths:
      extensions: [.go, .py, .js, .jsx, .ts, .tsx, .cs, .java, .kt, .rb, .php, .sql]
      path_segments: [migrations, migration, db, database, queries, schema]
    match_any:
      content_contains:
        - github.com/go-sql-driver/mysql
        - 'mysql://'
        - 'mysql+pymysql://'
        - import pymysql
        - from 'mysql2
        - require('mysql2
        - MySqlConnector
        - Pomelo.EntityFrameworkCore.MySql
        - ON DUPLICATE KEY UPDATE
      content_regex:
        - '(?i)\bENGINE\s*=\s*InnoDB\b'
        - '(?i)\b(?:int|bigint)\b[^,\n]*\bAUTO_INCREMENT\b'
  - language: shell
    probe_paths:
      extensions: [.sh, .bash, .zsh, .ksh, .yaml, .yml]
      path_segments: [scripts, bin, ci]
      path_prefixes: [.github/scripts/, .git/hooks/]
      path_contains: [/.github/scripts/, /.git/hooks/, .github/scripts/, .git/hooks/]
    match_any:
      content_contains:
        - shellcheck
        - set -Eeuo pipefail
        - set -euo pipefail
        - '[['
        - declare -a
        - declare -A
        - BASH_SOURCE
        - ' trap '
      content_regex:
        - '(?m)^#!.*(?:bash|/sh|env sh)\b'
        - '\$\{[A-Za-z_][A-Za-z0-9_]*:\?[^}]*\}'

  - language: html
    probe_paths:
      extensions: [.js, .jsx, .ts, .tsx, .vue, .svelte, .astro, .razor, .cshtml, .html, .htm, .css, .scss, .sass]
    match_any:
      extensions: [.jsx, .tsx, .vue, .svelte, .astro, .razor, .cshtml, .html, .htm, .css, .scss, .sass]
      content_contains:
        - <style
        - aria-
        - styled.
        - 'css`'
        - '@media'
      content_regex:
        - '(?is)<(?:a|abbr|address|article|aside|audio|b|base|bdi|bdo|blockquote|body|br|button|canvas|caption|cite|code|col|colgroup|data|datalist|dd|del|details|dfn|dialog|div|dl|dt|em|embed|fieldset|figcaption|figure|footer|form|h[1-6]|head|header|hr|html|i|iframe|img|input|ins|kbd|label|legend|li|link|main|map|mark|menu|meta|meter|nav|noscript|object|ol|option|output|p|picture|pre|progress|q|rp|rt|ruby|s|samp|script|section|select|slot|small|source|span|strong|style|sub|summary|sup|svg|table|tbody|td|template|textarea|tfoot|th|thead|time|title|tr|track|u|ul|var|video|wbr|[a-z][a-z0-9:-]*-[a-z0-9:-]*)(?:\s+[^<>]*)?>'
        - '(?is)(?:^|\n)\s*[.#]?[a-z][a-z0-9_-]*(?:\s+[.#]?[a-z][a-z0-9_-]*)?\s*\{[^{}]*:[^{}]*\}'
        - '--[A-Za-z0-9_-]+\s*:'

  - language: kubernetes
    probe_paths:
      extensions: [.go, .yaml, .yml]
    match_any:
      basenames: [kustomization.yaml, kustomization.yml]
      basename_suffixes: [.k8s.yaml, .k8s.yml, .kubernetes.yaml, .kubernetes.yml]
      path_segments: [k8s, kubernetes, manifests]
      path_contains:
        - /config/crd/
        - /config/rbac/
        - /config/default/
        - /config/manager/
        - /config/webhook/
        - /config/prometheus/
        - /config/network-policy/
        - /config/samples/
        - /internal/controller/
        - /controllers/
        - config/crd/
        - config/rbac/
        - config/default/
        - config/manager/
        - config/webhook/
        - config/prometheus/
        - config/network-policy/
        - config/samples/
        - internal/controller/
        - controllers/
      content_contains:
        - '+kubebuilder:'
        - '+k8s:'
        - sigs.k8s.io/controller-runtime
        - k8s.io/apimachinery
        - k8s.io/api/
        - k8s.io/client-go
        - metav1.TypeMeta
      content_regex:
        - '(?is)\bapiVersion:\s*[^\n]+\n.*\bkind:\s*[^\n]+'

# Dialect guides replace the generic SQL guide when the project's toolchain
# pins the database server (a postgres or mysql image) or a dialect detector
# matched the change.
toolchain_companions:
  sql: [postgresql, mysql]
